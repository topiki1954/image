<div style="font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 15px; border: 1px solid #ddd; border-radius: 8px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
  <h3 style="margin-top: 0; text-align: center; color: #006644;">Simulator Visualisasi Ikatan Kovalen</h3>
  
  <!-- Area Visualisasi Utama -->
  <div style="height: 140px; background: #f9f9f9; border: 1px dashed #ccc; border-radius: 6px; position: relative; margin-bottom: 15px; overflow: hidden;">
    
    <!-- Atom A (Kiri) -->
    <div id="atomA" style="position: absolute; left: 20%; top: 50%; transform: translateY(-50%); width: 45px; height: 45px; background: #3498db; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; transition: all 0.5s ease-in-out; z-index: 2;">A</div>
    
    <!-- Pasangan Elektron (Tengah) -->
    <div id="electronPair" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 5px; transition: all 0.5s ease-in-out; z-index: 3;">
      <div style="width: 8px; height: 8px; background: #e74c3c; border-radius: 50%;"></div>
      <div style="width: 8px; height: 8px; background: #e74c3c; border-radius: 50%;"></div>
    </div>
    
    <!-- Atom B (Kanan) -->
    <div id="atomB" style="position: absolute; right: 20%; top: 50%; transform: translateY(-50%); width: 45px; height: 45px; background: #2ecc71; color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; transition: all 0.5s ease-in-out; z-index: 2;">B</div>
    
    <!-- Indikator Dipol (Polar) -->
    <span id="deltaPlus" style="position: absolute; left: 23%; top: 15%; color: #3498db; font-weight: bold; font-size: 16px; opacity: 0; transition: opacity 0.4s;">δ⁺</span>
    <span id="deltaMinus" style="position: absolute; right: 23%; top: 15%; color: #e74c3c; font-weight: bold; font-size: 16px; opacity: 0; transition: opacity 0.4s;">δ⁻</span>
  </div>

  <!-- Status Penjelasan -->
  <div style="background: #eef7ff; padding: 12px; border-left: 4px solid #006644; border-radius: 4px; margin-bottom: 15px; min-height: 80px; font-size: 14px; line-height: 1.5; color: #333;">
    <strong>Status:</strong> <span id="simStatus">Silakan pilih jenis ikatan di bawah untuk memulai simulasi.</span>
  </div>

  <!-- Tombol Kontrol -->
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
    <button onclick="setNonPolar()" style="padding: 10px; background: #4b5563; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;">Kovalen Nonpolar</button>
    <button onclick="setPolar()" style="padding: 10px; background: #4b5563; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;">Kovalen Polar</button>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
    <button onclick="setKoordinasi()" style="padding: 10px; background: #4b5563; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;">Kovalen Koordinasi</button>
    <button onclick="resetSim()" style="padding: 10px; background: #dc2626; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold;">Reset</button>
  </div>
</div>

<script>
  const atomA = document.getElementById('atomA');
  const atomB = document.getElementById('atomB');
  const pair = document.getElementById('electronPair');
  const status = document.getElementById('simStatus');
  const dMinus = document.getElementById('deltaMinus');
  const dPlus = document.getElementById('deltaPlus');
  
  // Variabel untuk menyimpan ID timer animasi
  let animTimeout; 

  function resetSim() {
    clearTimeout(animTimeout); // Menghentikan animasi jika tombol lain diklik saat animasi berjalan
    atomA.innerHTML = "A";
    atomB.innerHTML = "B";
    atomA.style.left = "20%";
    atomB.style.right = "20%";
    pair.style.left = "50%";
    dMinus.style.opacity = "0";
    dPlus.style.opacity = "0";
    status.innerHTML = "Silakan pilih jenis ikatan di bawah untuk memulai simulasi.";
  }

  function setNonPolar() {
    resetSim();
    atomA.innerHTML = "H";
    atomB.innerHTML = "H";
    pair.style.left = "50%";
    status.innerHTML = "<strong>Kovalen Nonpolar (H—H):</strong> Pasangan elektron berada tepat di tengah-tengah kedua inti atom. Keelektronegatifan kedua atom sama besar, sehingga tidak terbentuk kutub muatan (netral).";
  }

  function setPolar() {
    resetSim();
    atomA.innerHTML = "H";
    atomB.innerHTML = "Cl";
    pair.style.left = "62%";
    dMinus.style.opacity = "1";
    dPlus.style.opacity = "1";
    status.innerHTML = "<strong>Kovalen Polar (H—Cl):</strong> Pasangan elektron tertarik lebih kuat ke arah atom Cl karena keelektronegatifannya lebih tinggi. Hal ini membentuk kutub negatif parsial (δ⁻) pada Cl dan kutub positif parsial (δ⁺) pada H.";
  }

  function setKoordinasi() {
    resetSim();
    atomA.innerHTML = "NH<sub>3</sub>"; // Menggunakan <sub> agar angka 3 proporsional di bawah
    atomB.innerHTML = "H<sup>+</sup>";
    
    // TAHAP 1 (t = 0s): Elektron menempel pada NH3, H+ masih berjarak
    pair.style.left = "31%"; // Posisi nempel persis di sebelah kanan Atom A
    atomB.style.right = "20%"; // H+ belum bergerak dari posisi awal
    
    status.innerHTML = "<strong>Tahap 1:</strong> Atom N pada NH₃ memiliki pasangan elektron bebas (elektron menempel di N). Ion H⁺ datang mendekat tanpa membawa elektron.";

    // TAHAP 2 (t = 1.5s): H+ mendekat, elektron berpindah ke tengah
    animTimeout = setTimeout(() => {
      pair.style.left = "42%"; // Elektron bergeser ke tengah
      atomB.style.right = "36%"; // H+ mendekat agar nempel dengan elektron
      
      status.innerHTML = "<strong>Tahap 2 (Kovalen Koordinasi):</strong> Pasangan elektron lepas ke tengah untuk digunakan bersama. Sepasang elektron ini <strong>sepenuhnya berasal dari atom donor (N)</strong>.";
    }, 1500); // Penundaan 1,5 detik
  }
</script>
